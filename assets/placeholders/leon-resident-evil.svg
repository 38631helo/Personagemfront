<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0c182c"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <linearGradient id="policeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="biohazardYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glowLeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#bgLeon)"/>

  <!-- Tactical Scanner Grid / Radar -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.15" transform="translate(200, 220)">
    <circle r="110" fill="none"/>
    <circle r="75" fill="none"/>
    <circle r="40" fill="none"/>
    <line x1="-120" y1="0" x2="120" y2="0"/>
    <line x1="0" y1="-120" x2="0" y2="120"/>
  </g>

  <!-- Biohazard Hazard Stripes Top/Bottom -->
  <g opacity="0.2">
    <line x1="30" y1="36" x2="50" y2="20" stroke="#eab308" stroke-width="4"/>
    <line x1="50" y1="36" x2="70" y2="20" stroke="#eab308" stroke-width="4"/>
    <line x1="70" y1="36" x2="90" y2="20" stroke="#eab308" stroke-width="4"/>
    <line x1="310" y1="540" x2="330" y2="524" stroke="#eab308" stroke-width="4"/>
    <line x1="330" y1="540" x2="350" y2="524" stroke="#eab308" stroke-width="4"/>
    <line x1="350" y1="540" x2="370" y2="524" stroke="#eab308" stroke-width="4"/>
  </g>

  <!-- Outer Frames -->
  <rect x="18" y="18" width="364" height="524" rx="12" fill="none" stroke="url(#policeBlue)" stroke-width="2.5" opacity="0.8"/>
  <rect x="26" y="26" width="348" height="508" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="8 4"/>

  <!-- Central R.P.D. Police Shield Crest -->
  <g transform="translate(200, 220)">
    <!-- Shield Base -->
    <path d="M 0 -85 L 65 -50 L 65 20 Q 65 75 0 95 Q -65 75 -65 20 L -65 -50 Z" fill="#07162e" stroke="url(#policeBlue)" stroke-width="3" filter="url(#glowLeon)"/>

    <!-- Inner Shield Inset -->
    <path d="M 0 -72 L 52 -42 L 52 18 Q 52 62 0 80 Q -52 62 -52 18 L -52 -42 Z" fill="#040c19" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>

    <!-- Police Star / Crosshair Center -->
    <polygon points="0,-35 10,-10 35,-10 14,5 22,28 0,15 -22,28 -14,5 -35,-10 -10,-10" fill="url(#biohazardYellow)"/>

    <!-- R.P.D. Text Banner -->
    <rect x="-42" y="32" width="84" height="22" rx="4" fill="#0284c7"/>
    <text x="0" y="47" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" letter-spacing="3">R.P.D.</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(200, 65)">
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#061833" stroke="#0284c7" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="4" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="2">RESIDENT EVIL • 1998</text>
  </g>

  <!-- Bottom Identity Area -->
  <g transform="translate(200, 420)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Montserrat, sans-serif" font-weight="900" font-size="26" letter-spacing="3">LEON S. KENNEDY</text>
    <text x="0" y="24" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="3">RACCOON CITY POLICE</text>
    <line x1="-80" y1="36" x2="80" y2="36" stroke="#0284c7" stroke-width="1" opacity="0.5"/>
    <text x="0" y="52" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" letter-spacing="2">SURVIVAL HORROR VETERAN</text>
  </g>
</svg>
